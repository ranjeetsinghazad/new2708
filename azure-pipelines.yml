trigger: none

pool:
  name: anup_vmss_agent

stages:
  - stage: Terraform
    displayName: Terraform Deployment

    jobs:
      - job: TerraformJob
        displayName: Terraform Init Validate Apply

        steps:

          # ==========================================
          # Terraform Install
          # ==========================================

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          # ==========================================
          # Terraform Init
          # ==========================================

          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(Build.SourcesDirectory)/dev'
              backendServiceArm: 'anup_service_connection'
              backendAzureRmResourceGroupName: 'rg2'
              backendAzureRmStorageAccountName: 'stgars'
              backendAzureRmContainerName: 'container1'
              backendAzureRmKey: 'ranjeet.tfstate'

          # ==========================================
          # Terraform Validate
          # ==========================================

          - task: TerraformTask@5
            displayName: Terraform Validate
            inputs:
              provider: azurerm
              command: validate
              workingDirectory: '$(Build.SourcesDirectory)/dev'

          # ==========================================
          # Terraform Apply
          # ==========================================

          - task: TerraformTask@5
            displayName: Terraform Apply
            inputs:
              provider: azurerm
              command: apply
              commandOptions: '-auto-approve'
              workingDirectory: '$(Build.SourcesDirectory)/dev'
              environmentServiceNameAzureRM: 'anup_service_connection'
